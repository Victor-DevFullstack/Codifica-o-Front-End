<mat-card class="produtos">
    <mat-card-header>
        <h2>{{ nome }}</h2>
    </mat-card-header>

    <mat-card-content>
        <p>{{ preco | currency:'BRL' }}</p>
    </mat-card-content>

    <mat-card-actions>
        <button mat-raised-button color="primary" (click)="selecionarProduto()">Selecionar</button>
        <button mat-stroked-button color="accent" (click)="adicionarAoCarrinho()">Adicionar ao carrinho</button>
    </mat-card-actions>
</mat-card>
