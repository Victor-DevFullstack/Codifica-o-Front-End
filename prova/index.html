<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Loja</title>
    <link rel="stylesheet" href="./style.css">
</head>
<body>
    <header>
        <h1>Harmonia Musical</h1>
    </header>
    <main>
        <section id="cadastrar">
            <h2>Cadastre seu produto</h2>
            <form id="form-cadastro">
                <input type="text" id="input-nome" placeholder="Nome">
                <input type="text" id="input-preco" placeholder="Preço">
                <input type="url" id="input-imagem" placeholder="URL da imagem do produto">

                <button type="submit">Adicionar ao catálogo</button>
            </form>
        </section>

        <section id="catalogo">
            <h2>Produtos da Loja</h2>
            <div id="lista-produtos">
            </div>
        </section>
    </main>
    <footer>
        <p>&copy; 2026 Primeira Prova </p>
    </footer>

    <script src="./script.js"></script>
</body>
</html>
