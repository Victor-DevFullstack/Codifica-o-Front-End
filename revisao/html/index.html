<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Filmes</title>
    <link rel="stylesheet" href="../css/style.css">
</head>
<body>
    
    <header>
        <h1>Meu Catálogo de Filmes</h1>
    </header>

    <main>
        <section id="cadastro">
            <h2>Cadastrar Novo Filme</h2>
            <form id="form-cadastro">
                <input type="text" id="nome-item" placeholder="nome do filme">
                <input type="url" id="url-img" placeholder="URL da imagem do filme">
                <button type="submit">Adicionar ao catálogo</button>
            </form>
        </section>

        <section id="catalogo">
            <h2>Meus Filmes Favoritos</h2>
            <section id="lista-filmes">
                
            </section>
        </section>
    </main>

    <footer>
        <p>&copy; 2026 Atividade De Revisão</p>
    </footer>

    <script src="../js/script.js"></script>
</body>
</html>
